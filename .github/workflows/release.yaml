name: "Release"

# Releasing is driven by the VERSION file : bump it, push it on master, and
# once the CI is green the matching tag and release are created with the
# debian packages the CI just built.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - "completed"
    branches:
      - "master"

permissions:
  contents: "write"
  actions: "read"
  packages: "write"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the CI has built, and the whole history so the release
          # notes can be built from the previous tag
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: "Looking for a version to release"
        id: "version"
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null ; then
            echo "$tag already exists, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "releasing $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "Downloading the debian packages built by the CI"
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # By name, not everything the run produced : docker/build-push-action
          # uploads a build record of its own, and that one does not extract --
          # "zip: not a valid zip file" -- which failed the whole release for an
          # artifact it never wanted.
          gh run download "${{ github.event.workflow_run.id }}" --name artifact --dir artifacts

          mkdir debs
          find artifacts -name '*.deb' -exec mv {} debs/ \;
          ls -l debs

          # One package per architecture, named after the version being released
          for arch in amd64 armhf arm64 ; do
            test -f "debs/wigo-${{ steps.version.outputs.version }}-$arch.deb"
          done

      # Multi-arch, built from the tag being released. armhf is left out : the
      # 32 bit arm runners are slow enough to double the release time, and the
      # debian package covers that case.
      - name: "Setting up qemu"
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: "Setting up buildx"
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: "Logging in to the registry"
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: "Publishing the container image"
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: "build/docker/Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: "Creating the release"
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          .github/scripts/release-notes.sh "$tag" > notes.md
          cat notes.md

          # This creates the tag on the commit the CI has built
          gh release create "$tag" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Wigo $tag" \
            --notes-file notes.md \
            debs/*.deb
