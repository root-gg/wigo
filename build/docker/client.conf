# One of the two watched hosts of the compose example.
#
# It runs its own probes and serves its own API. The master polls that API, and
# acts on this host through it -- which is why AllowWriteActions is on here too:
# a remote applies its own gate, and a master cannot bypass it.

[Global]
Group                       = "demo"
LogFile                     = "/var/log/wigo.log"
ProbesDirectory             = "/usr/local/wigo/probes"
ProbesConfigDirectory       = "/etc/wigo/conf.d"
UuidFile                    = "/var/lib/wigo/uuid"
Database                    = "/var/lib/wigo/wigo.db"

[Http]
Enabled                     = true
Address                     = "0.0.0.0"
Port                        = 4000
AllowWriteActions           = true

[Notifications]
MinLevelToSend              = 250

[PushServer]
Enabled                     = false

[PushClient]
Enabled                     = false
