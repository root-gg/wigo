# A wigo watching the two clients of the compose example.
#
# PULL mode on purpose : the master polls the clients over their own HTTP API,
# which needs no certificates and no authority handshake. PUSH is what you want
# when the clients sit behind a NAT the master cannot reach, and it needs both.

[Global]
Hostname                    = "master"
Group                       = "demo"
LogFile                     = "/var/log/wigo.log"
ProbesDirectory             = "/usr/local/wigo/probes"
ProbesConfigDirectory       = "/etc/wigo/conf.d"
UuidFile                    = "/var/lib/wigo/uuid"
Database                    = "/var/lib/wigo/wigo.db"
AliveTimeout                = 60

[Http]
Enabled                     = true
Address                     = "0.0.0.0"
Port                        = 4000
Gzip                        = true
# Lets the interface enable, disable and repitch probes, here and on the
# clients. Closed by default everywhere else.
AllowWriteActions           = true

[RemoteWigos]
CheckInterval               = 10

[[AdvancedList]]
Hostname                    = "client-one"
Port                        = 4000

[[AdvancedList]]
Hostname                    = "client-two"
Port                        = 4000

[Notifications]
MinLevelToSend              = 250
OnProbeChange               = true
FlapDetection               = true
RenotifyInterval            = 3600

[PushServer]
Enabled                     = false

[PushClient]
Enabled                     = false
