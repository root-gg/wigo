#
## What Is Going On
#

# General parameters
#
# ListenAddress             -> Address on which wigo will listen
# ListenPort                -> Port on which wigo will listen
# Group                     -> Group of current machine (webserver, loadbalancer,...).
# AliveTimeout              -> Number of seconds before setting remote wigo in error 
#                           If provided, a tag group will be added on OpenTSDB puts
#
[Global]
Hostname                    = ""
Group                       = ""
LogFile                     = "dev/wigo.log"
ProbesDirectory             = "dev/probes"
ProbesConfigDirectory       = "etc/conf.d"
UuidFile                    = "dev/uuid"
Database                    = "dev/wigo.db"
AliveTimeout                = 60

# How many days of what the probes measure to keep, in the sqlite that is
# already there. A week of a machine running twenty probes is around 35 Mo.
# 0 keeps none : nothing about the monitoring depends on this, losing it loses
# history and nothing else.
MetricsRetentionDays        = 7

# How many days of status changes to keep : when something went from OK to
# critical and back. A handful of lines a day, not one a minute, so the cost is
# nothing next to the metrics. 0 keeps none, and the timeline is then empty.
StatusHistoryDays           = 30
Debug                       = true

[Http]
Enabled                     = true
Address                     = "0.0.0.0"
Port                        = 4400
SslEnabled                  = false
SslCert                     = "dev/http.crt"
SslKey                      = "dev/http.key"
Login                       = ""
Password                    = ""
AllowWriteActions           = true

# What somebody presenting no credential at all may do.
#
#   ""          -> whatever this install already did : everything if no Login
#                  is set, nothing if one is. Leave it alone and an upgrade
#                  changes nothing.
#   "none"      -> refused. Login, or a token, is required to see anything.
#   "readonly"  -> anyone who can reach it may look, and only the Login above
#                  or an operator token may change anything.
#   "operator"  -> anyone who can reach it may do anything AllowWriteActions
#                  permits. This is what a wigo with no Login has always done.
#
# An unknown value is treated as "readonly" : a typo in the setting meant to
# lock a wigo down must not be what opens it.
AnonymousRole               = ""

[PushServer]
Enabled                     = true
Address                     = "0.0.0.0"
Port                        = 4401
SslEnabled                  = true
SslCert                     = "dev/wigo.crt"
SslKey                      = "dev/wigo.key"
AllowedClientsFile          = "dev/allowed_clients"
AutoAcceptClients           = false

[PushClient]
Enabled                     = false
Address                     = ""
Port                        = 4401
SslEnabled                  = true
SslCert                     = "dev/master.crt"
UuidSig                     = "dev/uuid.sig"
PushInterval                = 10

# OpenTSDB
#
# You can specify an OpenTSDB instance to graph all probes metrics
#
# Params :
#   OpenTSDBEnabled         -> Wether or not OpenTSDB graphing is enabled (true/false)
#   OpenTSDBAddress         -> Ip of OpenTSDB instance
#   OpenTSDBPort            -> Port of OpenTSDB instance
#   OpenTSDBMetricPrefix    -> Prefix added before metric name (a dot will be added between prefix and probe name)
#
[OpenTSDB]
Enabled                     = false
Address                     = ["localhost"]
SslEnabled                  = false
MetricPrefix                = "wigo"
Deduplication               = 600
BufferSize                  = 10000

# RemoteWigos
#
# You can configure remoteWigos to monitore them from that instance of Wigo
#
# CheckInterval      -> Number of seconds between remote wigo checks (do not set a value lower than AliveTimeout/2)
#

[RemoteWigos]
CheckInterval               = 10
SslEnabled		            = false
Login			            = ""
Password		            = ""

# Simple mode (you just define hostname and port, which is optional)
# List                        = [
#     "ip",                        -> IP (mandatory)  : Hostname of remoteWigo to check
#     "ip:port",                   -> port (optional) : Port to connect to on remote host (default is local ListenPort)
# ]
#
List                        = []

# Full mode (every configuration parameter is customizable by remote wigo)
# [[AdvancedList]]
#    Hostname          = "ip"      -> mandatory: Hostname of remoteWigo to check
#    Port              = 4000      -> optional : Port of remoteWigo to check (default is local ListenPort)
#    CheckInterval     = 10        -> optional : Number of seconds between remote wigo checks (default is RemoteWigosCheckInterval)
#    CheckRemotesDepth = 0         -> optional : Depth level for remoteWigos of remoteWigo checking (default is 0 -> all levels)
#
#[[AdvancedList]]
#    Hostname        = "ip2"
#    CheckRemotes    = 1
#


# Notifications
#
# You can configure notifications (http,email) when a probe/host status changes
#
[Notifications]

# General
MinLevelToSend              = 250
RescueOnly                  = false
OnWigoChange                = false
OnProbeChange               = false

# A probe that keeps changing status buries the real incident of the evening
# under fifty messages. Once it has changed FlapThreshold times inside
# FlapWindow seconds it is called out once, then left alone until it settles.
# Nothing is hidden : it keeps running and the early changes are notified.
FlapDetection               = true
FlapWindow                  = 3600                  # -> seconds
FlapThreshold               = 5                     # -> status changes

# Notifications fire on a status change, so a probe that breaks at 3am and is
# still broken at 9am produces exactly one message. Repeat it while it lasts.
# 0 disables the repeats.
RenotifyInterval            = 0                     # -> seconds

# After this long unattended, a problem also goes to the apprise targets marked
# Escalation = true. 0 never escalates.
EscalateAfter               = 0                     # -> seconds

# The window nobody wants to be woken in. Nothing is dropped : a notification
# held here is not recorded as sent, so it goes out as soon as the window
# closes -- which needs RenotifyInterval to be set. Anything at or above
# QuietHoursMinLevelToSend gets through anyway, 0 lets nothing through.
QuietHoursFrom              = ""                    # -> "22:00"
QuietHoursTo                = ""                    # -> "08:00"
QuietHoursMinLevelToSend    = 0

# HTTP
HttpEnabled                 = 0                     # -> 0: disabled, 1: enabled
HttpUrl                     = ""

# Apprise https://github.com/caronc/apprise
AppriseEnabled              = 0                     # -> 0: disabled, 1: enabled
ApprisePath                 = "/usr/local/bin/apprise" # Path to the Apprise binary, you need to install it first
# List of Apprise URLs receiving ALL notifications, see https://github.com/caronc/apprise/wiki/Notify_urls
AppriseUrls                 = []

# EMAIL
EmailEnabled                = 0                     # -> 0: disabled, 1: enabled, 2: only if http failed
EmailSmtpServer             = "smtp.domain.tld:25"
EmailRecipients             = ["user@domain.tld","user2@domain.tld"]
EmailFromName               = "Wigo"
EmailFromAddress            = "wigo@domain.tld"

# Apprise targets : send a set of urls only for some groups and/or some hosts.
# Groups and Hosts are OR'ed, matching is case insensitive and "*" matches everything.
# Use AppriseUrls above to notify every host.
# Those blocks must stay at the end of the [Notifications] section.
#
#[[Notifications.AppriseTargets]]
#Name                        = "dba team"
#Urls                        = ["mailto://user:pass@domain.tld"]
#Groups                      = ["databases"]
#Hosts                       = ["db-master.domain.tld"]
#
#[[Notifications.AppriseTargets]]
#Name                        = "web team"
#Urls                        = ["slack://token/#alerts"]
#Groups                      = ["frontend","backend"]

# What sits behind what.
#
# A router goes down and the forty hosts behind it stop answering. Each one is
# a separate discovery and a separate message, and none of the forty is the
# news : the router is. While a parent is not answering, nothing is said about
# what sits behind it -- and nothing is said when it comes back either, since
# nobody was told it had broken.
#
# The status is unchanged: those hosts are still shown as down, still logged,
# still on their timeline. Only the interruption is held.
#
# Each rule names a Host or a Group, never both, and what it depends on. Only
# direct parents are looked at : a host behind a switch behind a router still
# works, because a router that is down takes the switch with it.
#
# [[Dependencies]]
# Group                     = "par1"
# DependsOn                 = ["router-par1"]
#
# [[Dependencies]]
# Host                      = "web3.example.com"
# DependsOn                 = ["sw-2"]
